<ion-header>
    <ion-toolbar color="#">
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/home"></ion-back-button>
        </ion-buttons>
        <ion-title>
            {{productDetail.nombre}}
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <div class="producto">

        <div class="product-img" (click)="openImgModal(productDetail.img)">
            <img [src]="productDetail.img">
        </div>

        <div class="product-title">
            <h2>{{productDetail.nombre}}</h2>
        </div>
        
    </div>
    <div class="precio-cant">
        <div class="precio">
            <h2>${{productDetail.precio}}</h2>
        </div>
    </div>
    <div class="add-cart" *ngIf="islog">
        <div class="button-cart client-cnt" style="display: flex; align-items: center; margin-right: 5px; ">
            <ion-img src="../../../assets/icons/remove-outline.svg" (click)="removeToCart(productDetail)" style="width: 25px;"></ion-img>
            <b class="qty-field">{{productDetail.qty}}</b>
            <ion-img src="../../../assets/icons/add-outline.svg" (click)="addQty(productDetail)" style="width: 25px;"></ion-img>
        </div>

        <div class="btn-cart">
            <ion-img src="../../../assets/icons/cart-outline.svg" *ngIf="productDetail.qty > 0" style="width: 30px;" (click)="addToCart(productDetail)"
                class="floating"></ion-img>
        </div>
    </div>

</ion-content>

<app-footer-nav currentRoute="/" [qtyOrders]="cartItems"></app-footer-nav>
